name: Diagnose PM2 (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check nginx status and config
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== nginx status ==="
            systemctl status nginx --no-pager -l | head -20 || true
            echo ""
            echo "=== nginx config test ==="
            nginx -t 2>&1 || true
            echo ""
            echo "=== sites-enabled configs mentioning app.conectamente.cl or 3100 ==="
            grep -rl "app.conectamente.cl\|:3100" /etc/nginx/sites-enabled/ 2>/dev/null || true
            echo ""
            grep -A5 "server_name\|proxy_pass" /etc/nginx/sites-enabled/* 2>/dev/null || true
            echo ""
            echo "=== recent nginx error log ==="
            tail -30 /var/log/nginx/error.log 2>/dev/null || true
            echo ""
            echo "=== pm2 status ==="
            pm2 status || true
