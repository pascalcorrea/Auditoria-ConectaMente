name: Diagnose PM2 (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Fix nginx proxy_pass port for app.conectamente.cl
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== before ==="
            grep proxy_pass /etc/nginx/sites-enabled/app.conectamente.cl

            cp /etc/nginx/sites-enabled/app.conectamente.cl /etc/nginx/sites-enabled/app.conectamente.cl.bak-before-3100-fix
            sed -i 's#proxy_pass http://127.0.0.1:3001;#proxy_pass http://127.0.0.1:3100;#' /etc/nginx/sites-enabled/app.conectamente.cl

            echo ""
            echo "=== after ==="
            grep proxy_pass /etc/nginx/sites-enabled/app.conectamente.cl

            echo ""
            echo "=== nginx -t ==="
            nginx -t

            echo ""
            echo "=== reload nginx ==="
            systemctl reload nginx

            sleep 1
            echo ""
            echo "=== curl https://app.conectamente.cl/login ==="
            curl -s -o /dev/null -w "HTTP %{http_code}\n" https://app.conectamente.cl/login
