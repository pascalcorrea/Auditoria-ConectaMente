name: Fix PM2 & Deploy

on:
  workflow_dispatch:

jobs:
  fix-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix PM2 and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          timeout: 10m
          command_timeout: 5m
          script: |
            cd /var/www/app

            echo "=== Killing all PM2 processes ==="
            pm2 kill || true
            sleep 2

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "=== Installing dependencies ==="
            npm install --legacy-peer-deps

            echo "=== Generating Prisma ==="
            npx prisma generate

            echo "=== Building ==="
            npm run build

            echo "=== Starting app with PM2 ==="
            pm2 start ecosystem.config.js --name auditoria-conectamente

            echo "=== Waiting for app to start ==="
            sleep 3

            echo "=== PM2 Status ==="
            pm2 status

            echo "=== Testing if app is running ==="
            curl -s http://localhost:3100/ | head -20 || echo "App might still be starting..."

            echo ""
            echo "✅ Deploy complete! Check https://peritajes.conectamente.cl/"
