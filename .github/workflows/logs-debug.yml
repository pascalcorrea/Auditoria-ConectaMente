name: Check Logs & Status

on:
  workflow_dispatch:

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Check everything
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          timeout: 10m
          command_timeout: 5m
          script: |
            echo "=== PM2 Status ==="
            pm2 status

            echo ""
            echo "=== PM2 Logs (last 50 lines) ==="
            pm2 logs --lines 50 --nostream 2>/dev/null || pm2 logs 2>/dev/null

            echo ""
            echo "=== Check if ports are listening ==="
            netstat -tlnp 2>/dev/null | grep -E "3100|80|443" || ss -tlnp 2>/dev/null | grep -E "3100|80|443"

            echo ""
            echo "=== Check app directory ==="
            cd /var/www/app
            echo "Files:"
            ls -la | tail -10

            echo ""
            echo "=== Check if .next exists ==="
            ls -lah .next 2>/dev/null | head -5 || echo ".next not found"

            echo ""
            echo "=== Test localhost:3100 ==="
            curl -v http://localhost:3100/ 2>&1 | head -30 || echo "Connection failed"
