name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches: [staging]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
      - run: npm run test 2>&1 || true

      - name: Deploy to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          STAGING_SERVER: staging.conectamente.cl
        run: |
          echo "Deploy ready. Manual steps:"
          echo "1. Copy .next/ to staging server"
          echo "2. Run: npm run start"
          echo "3. Visit: https://staging.conectamente.cl"

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh https://staging.conectamente.cl || echo "Staging not yet live"
