name: Check Status & Deploy

on:
  workflow_dispatch:

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Build
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Check and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          script: |
            echo "=== Checking Node version ==="
            node -v
            npm -v

            echo "=== Checking PM2 status ==="
            pm2 status || echo "PM2 not initialized"

            echo "=== Pulling latest code ==="
            cd /var/www/app
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "=== Installing dependencies ==="
            npm install --production=false --legacy-peer-deps

            echo "=== Generating Prisma ==="
            npx prisma generate

            echo "=== Building ==="
            npm run build

            echo "=== Starting/Restarting app ==="
            pm2 startOrRestart ecosystem.config.js || pm2 start npm --name auditoria-conectamente -- start

            echo "=== PM2 status ==="
            pm2 status

            echo "=== Checking if app is listening ==="
            sleep 2
            curl -s http://localhost:3100/login | head -20 || echo "App might still be starting..."

            echo ""
            echo "✅ Deploy complete! App should be running on port 3100"
            echo "Check: https://peritajes.conectamente.cl/"
