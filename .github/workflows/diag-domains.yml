name: Diagnose stale root page (temporary, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check source vs build output
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            echo "=== source app/page.tsx ==="
            sudo cat /var/www/app/app/page.tsx

            echo ""
            echo "=== git log -1 ==="
            sudo git config --global --add safe.directory /var/www/app
            sudo git -C /var/www/app log -1 --oneline

            echo ""
            echo "=== .next build output for / ==="
            sudo grep -o "Auditorías Médicas\|Create Next App" /var/www/app/.next/server/app/index.html 2>/dev/null

            echo ""
            echo "=== .next mtime ==="
            sudo stat /var/www/app/.next/server/app/index.html 2>/dev/null | grep Modify

            echo ""
            echo "=== pm2 status / restart time ==="
            sudo pm2 jlist | grep -A3 '"name":"auditoria-conectamente"' | grep -E "pm_uptime|restart_time" || sudo pm2 describe auditoria-conectamente | grep -E "uptime|restarts|created"
