name: Diagnose other domains (temporary, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Full cert list + nidoapp process check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            echo "=== certbot certificates ==="
            sudo certbot certificates 2>&1 < /dev/null

            echo ""
            echo "=== docker volumes ==="
            sudo docker volume ls < /dev/null

            echo ""
            echo "=== how is nidoapp run? (systemd, cron) ==="
            sudo systemctl list-units --type=service --all 2>/dev/null | grep -i nido
            ls /home/ 2>&1
            ls -la /home/*/.pm2/logs/ 2>&1 | grep -i nido

            echo ""
            echo "=== sites-available vs sites-enabled (symlink check) ==="
            ls -la /etc/nginx/sites-enabled/ | grep -E "staging|calcom|twenty|wordpress-audit|nidoapp"
