name: Prep peritajes for automated deploy (destructive, one-shot)

on:
  workflow_dispatch:

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Configure opsbot's git access and hand over the PM2 process
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -x

            echo "### opsbot ssh config for github.com ###"
            mkdir -p ~/.ssh
            if ! grep -q "Host github.com" ~/.ssh/config 2>/dev/null; then
              cat >> ~/.ssh/config <<'EOF'
            Host github.com
              IdentityFile ~/.ssh/opsbot_key
              IdentitiesOnly yes
              StrictHostKeyChecking no
            EOF
            fi
            chmod 600 ~/.ssh/config

            echo "### fix ownership of /var/www/peritajes ###"
            sudo chown -R opsbot:opsbot /var/www/peritajes

            echo "### stop the manually-started root-owned pm2 process ###"
            sudo pm2 delete web-conectamente-auditoria < /dev/null || true

            echo "### confirm ownership + git access ###"
            ls -ld /var/www/peritajes
            cd /var/www/peritajes && git fetch origin main && echo "git fetch OK"
