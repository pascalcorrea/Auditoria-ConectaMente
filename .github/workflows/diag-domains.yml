name: Diagnose port 3100 content (temporary, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check what's actually on 3100
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            echo "=== pm2 status ==="
            pm2 status

            echo ""
            echo "=== curl localhost:3100 title ==="
            curl -s http://localhost:3100/ | grep -o "<title>[^<]*</title>"

            echo ""
            echo "=== /var/www/app git log + remote ==="
            cd /var/www/app
            sudo git log -1 --oneline
            sudo git remote -v
            sudo cat package.json | grep '"name"'

            echo ""
            echo "=== /var/www/app/.next build id + mtime ==="
            sudo cat /var/www/app/.next/BUILD_ID 2>/dev/null
            sudo stat /var/www/app/.next | head -5

            echo ""
            echo "=== search for 'Peritajes ConectaMente' string in /var/www/app ==="
            sudo grep -rl "Peritajes ConectaMente" /var/www/app/app /var/www/app/components /var/www/app/.next/server/app 2>/dev/null | head -20
