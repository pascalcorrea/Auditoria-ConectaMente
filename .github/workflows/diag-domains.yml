name: Diagnose other domains (temporary, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inventory cal/crm/nidoapp/staging/peritajes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            echo "=== whoami / groups ==="
            whoami
            groups

            echo ""
            echo "=== docker ps -a ==="
            sudo docker ps -a

            echo ""
            echo "=== ports 3001, 3003, 3004, 3030 ==="
            sudo ss -tlnp | grep -E ":3001|:3003|:3004|:3030"

            echo ""
            echo "=== mysql databases ==="
            sudo mysql -e "SHOW DATABASES;"

            echo ""
            echo "=== postgres databases (docker) ==="
            sudo docker exec conectamente-db psql -U app_user -l

            echo ""
            echo "=== /var/www/peritajes ==="
            sudo ls -la /var/www/peritajes
            sudo cat /var/www/peritajes/package.json 2>/dev/null | grep '"name"'
            cd /var/www/peritajes 2>/dev/null && sudo git remote -v

            echo ""
            echo "=== /var/www/conectamente-staging ==="
            sudo ls -la /var/www/conectamente-staging | head -10

            echo ""
            echo "=== /opt/twenty and /opt/calcom ==="
            sudo ls -la /opt/twenty 2>/dev/null | head -10
            sudo ls -la /opt/calcom 2>/dev/null | head -10
