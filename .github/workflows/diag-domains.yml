name: Get opsbot public key (read-only)

on:
  workflow_dispatch:

jobs:
  getkey:
    runs-on: ubuntu-latest
    steps:
      - name: Print public key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cat ~/.ssh/opsbot_key.pub
