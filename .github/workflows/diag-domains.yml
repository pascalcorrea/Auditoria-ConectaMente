name: Fix duplicate PM2 instance (destructive, one-shot)

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Kill root's redundant PM2 process, keep the deploy user's official one
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            set -x

            echo "### delete root's own pm2-managed auditoria-conectamente ###"
            sudo pm2 delete auditoria-conectamente < /dev/null

            echo "### give the port a moment to free up ###"
            sleep 2
            sudo ss -tlnp | grep 3100 || echo "port free, nothing bound yet"

            echo "### restart the deploy user's own instance so it can bind 3100 cleanly ###"
            sudo -u ${{ secrets.SSH_USER }} pm2 restart auditoria-conectamente < /dev/null || true
            sleep 3
            sudo -u ${{ secrets.SSH_USER }} pm2 status

            echo "### verify ###"
            curl -s http://localhost:3100/ | grep -o "<title>[^<]*</title>"
