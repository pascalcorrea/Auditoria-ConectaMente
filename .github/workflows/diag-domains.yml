name: Cleanup unused domains (destructive, one-shot)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove staging, cal, crm, wp-audit, nidoapp, pruebas.nidoapp
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -x

            echo "### nginx sites ###"
            sudo rm -f /etc/nginx/sites-enabled/staging-conectamente /etc/nginx/sites-available/staging-conectamente
            sudo rm -f /etc/nginx/sites-enabled/calcom /etc/nginx/sites-available/calcom
            sudo rm -f /etc/nginx/sites-enabled/twenty /etc/nginx/sites-available/twenty
            sudo rm -f /etc/nginx/sites-enabled/wordpress-audit /etc/nginx/sites-available/wordpress-audit
            sudo rm -f /etc/nginx/sites-enabled/nidoapp /etc/nginx/sites-available/nidoapp
            sudo rm -f /etc/nginx/sites-enabled/nidoapp-pruebas /etc/nginx/sites-available/nidoapp-pruebas

            echo "### certbot ###"
            sudo certbot delete --cert-name cal.conectamente.cl --non-interactive < /dev/null
            sudo certbot delete --cert-name crm.conectamente.cl --non-interactive < /dev/null
            sudo certbot delete --cert-name nidoapp.cloud --non-interactive < /dev/null
            sudo certbot delete --cert-name pruebas.nidoapp.cloud --non-interactive < /dev/null

            echo "### docker containers + volumes ###"
            sudo docker rm -f calcom calcom-db < /dev/null
            sudo docker volume rm calcom_calcom-db-data calcom_calcom-uploads < /dev/null
            sudo docker rm -f twenty-server-1 twenty-worker-1 twenty-db-1 twenty-twenty-redis-1 < /dev/null
            sudo docker volume rm twenty_twenty-db twenty_twenty-redis twenty_twenty-storage < /dev/null

            echo "### filesystem ###"
            sudo rm -rf /var/www/conectamente-staging
            sudo rm -rf /opt/calcom
            sudo rm -rf /opt/twenty
            sudo rm -rf /var/www/wordpress-audit
            sudo rm -rf /var/www/nidoapp
            sudo rm -rf /var/www/nidoapp-pruebas

            echo "### mysql ###"
            sudo mysql -e "DROP DATABASE IF EXISTS conectamente_wp_audit;" < /dev/null

            echo "### nginx reload ###"
            sudo nginx -t
            sudo systemctl reload nginx

            echo "### done, remaining sites ###"
            ls /etc/nginx/sites-enabled/
