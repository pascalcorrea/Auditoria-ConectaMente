name: Diagnose port 3100 content (temporary, read-only)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check git state and orphan processes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: opsbot
          key: ${{ secrets.OPS_SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 3m
          script: |
            sudo git config --global --add safe.directory /var/www/app

            echo "=== /var/www/app git log (last 5) ==="
            sudo git -C /var/www/app log -5 --oneline

            echo ""
            echo "=== /var/www/app git remote ==="
            sudo git -C /var/www/app remote -v

            echo ""
            echo "=== /var/www/app git status ==="
            sudo git -C /var/www/app status --short | head -30

            echo ""
            echo "=== what's actually listening on 3100 right now (orphan check) ==="
            sudo ss -tlnp | grep 3100

            echo ""
            echo "=== full process list for anything with 'next' or 'node' ==="
            ps aux | grep -E "next|node" | grep -v grep
