name: Diagnose migrate status (temporary)

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check migrate status on production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.PROJECT_DIR }} || exit 1
            echo "=== prisma migrate status ==="
            npx prisma migrate status || true
            echo ""
            echo "=== actual live schema (introspection, does not touch schema.prisma) ==="
            npx prisma db pull --print 2>&1 | grep -A3 -E "model (LogEnvio|PagoMedico|FacturaOrganizacion)|enum (CanalEnvio|EstadoEnvio|EstadoPago|EstadoFactura)" || echo "none of the new models/enums exist yet"
