name: Build Only (Diagnostics)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

      - name: Build successful
        run: echo "✅ Build completed successfully"
