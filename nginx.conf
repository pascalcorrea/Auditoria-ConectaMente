server {
    listen 80;
    server_name peritajes.conectamente.cl;

    location / {
        proxy_pass http://localhost:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SSL configuration (uncomment when Let's Encrypt is set up)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/peritajes.conectamente.cl/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/peritajes.conectamente.cl/privkey.pem;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name peritajes.conectamente.cl;
    return 301 https://$server_name$request_uri;
}
